<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'vets')}">

<body>

  <h2 th:text="#{vets}">Veterinarians</h2>

  <form th:action="@{/vets.html}" method="get" class="form-horizontal" id="search-vet-form">
    <div class="form-group">
      <label for="specialty" class="col-sm-2 control-label" th:text="#{specialties}">Specialties</label>
      <div class="col-sm-10">
        <select id="specialty" name="specialty" class="form-control">
          <option value="" th:selected="${selectedSpecialty == null}" th:text="#{allSpecialties}">All</option>
          <option th:each="specialty : ${specialties}" th:value="${specialty.id}"
            th:selected="${specialty.id == selectedSpecialty}" th:text="${specialty.name}">radiology</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <div class="col-sm-offset-2 col-sm-10">
        <button type="submit" class="btn btn-primary" th:text="#{findVets}">Find Veterinarians</button>
      </div>
    </div>
  </form>

  <p th:if="${totalItems == 0}" id="no-vets-found" th:text="#{noVetsFound}">No veterinarians found</p>

  <table id="vets" class="table table-striped" th:unless="${totalItems == 0}">
    <thead>
      <tr>
        <th th:text="#{name}">Name</th>
        <th th:text="#{specialties}">Specialties</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="vet : ${listVets}">
        <td th:text="${vet.firstName + ' ' + vet.lastName}"></td>
        <td>
          <span th:each="specialty : ${vet.specialties}" th:text="${specialty.name + ' '}" /> <span
            th:if="${vet.nrOfSpecialties == 0}" th:text="#{none}">none</span>
        </td>
      </tr>
    </tbody>
  </table>
  <div th:if="${totalPages > 1}"
    th:with="specialtyParam=${selectedSpecialty == null ? '' : '&specialty=' + selectedSpecialty}">
    <span th:text="#{pages}">Pages:</span>
    <span>[</span>
    <span th:each="i: ${#numbers.sequence(1, totalPages)}">
      <a th:if="${currentPage != i}" th:href="@{${'/vets.html?page=' + i + specialtyParam}}">[[${i}]]</a>
      <span th:unless="${currentPage != i}">[[${i}]]</span>
    </span>
    <span>]&nbsp;</span>
    <span>
      <a th:if="${currentPage > 1}" th:href="@{${'/vets.html?page=1' + specialtyParam}}" th:title="#{first}"
        class="fa fa-fast-backward"></a>
      <span th:unless="${currentPage > 1}" th:title="#{first}" class="fa fa-fast-backward"></span>
    </span>
    <span>
      <a th:if="${currentPage > 1}" th:href="@{${'/vets.html?page=' + (currentPage - 1) + specialtyParam}}" th:title="#{previous}"
        class="fa fa-step-backward"></a>
      <span th:unless="${currentPage > 1}" th:title="#{previous}" class="fa fa-step-backward"></span>
    </span>
    <span>
      <a th:if="${currentPage < totalPages}" th:href="@{${'/vets.html?page=' + (currentPage + 1) + specialtyParam}}" th:title="#{next}"
        class="fa fa-step-forward"></a>
      <span th:unless="${currentPage < totalPages}" th:title="#{next}" class="fa fa-step-forward"></span>
    </span>
    <span>
      <a th:if="${currentPage < totalPages}" th:href="@{${'/vets.html?page=' + totalPages + specialtyParam}}" th:title="#{last}"
        class="fa fa-fast-forward"></a>
      <span th:unless="${currentPage < totalPages}" th:title="#{last}" class="fa fa-fast-forward"></span>
    </span>
  </div>
</body>

</html>
